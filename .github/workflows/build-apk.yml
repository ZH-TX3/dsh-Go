name: build-apk

# Builds the APKs this fork exists for: every build type registers the accessibility probe,
# so `adb shell am broadcast -a …A11Y_PROBE --es cmd dump` reads the screen in ~100 ms.
# Artifacts land on the run page: app-<flavor>-<mode>.apk, debug-key signed.
on:
  push:
    branches: [main]
    paths:
      - app/android/**
      - app/pubspec.yaml
      - app/pubspec.lock
      - tooling/a11y-dump.sh
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.flavor }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
        flavor: [arm64, x64]
        exclude:
          # x64 is the emulator flavor; release of it answers nothing.
          - mode: release
            flavor: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned: app/.metadata's revision is this exact release (Dart 3.13.5).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - id: cache-key
        run: echo "cache-key=gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cache-key.outputs.cache-key }}
          restore-keys: gradle-${{ runner.os }}-

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: build
        working-directory: app
        env:
          MODE: ${{ matrix.mode }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          name=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          code=$(python3 ../tooling/build_number.py)
          platform=android-arm64
          if [ "$FLAVOR" = x64 ]; then platform=android-x64; fi
          # The bundle at runtime/out is built separately (runtime/build-runtime.sh) and is not
          # in the repo, so this APK carries no Linux rootfs. Accessibility and the probe do not
          # depend on it.
          flutter build apk "--$MODE" \
            --flavor "$FLAVOR" \
            --target-platform "$platform" \
            --build-name "$name" \
            --build-number "$code" \
            --dart-define=DSH_APP_VERSION="$name+$code"

      - name: unit tests (a11y, launcher icons)
        if: matrix.flavor == 'x64' && matrix.mode == 'debug'
        working-directory: app/android
        run: >
          ./gradlew :app:testX64DebugUnitTest
          --tests 'io.github.ccch1mneyyy.dsh_app.phone.a11y.*'
          --tests 'io.github.ccch1mneyyy.dsh_app.icons.*'
          --tests 'io.github.ccch1mneyyy.dsh_app.launch.LaunchThemesTest'

      - name: inspect
        working-directory: app
        env:
          MODE: ${{ matrix.mode }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-$FLAVOR-$MODE.apk"
          test -f "$apk" || { ls -l build/app/outputs/flutter-apk/; exit 1; }
          aapt2=$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badge=$("$aapt2" dump badging "$apk" | sed -n '/^package:/p')
          echo "$badge"
          # Coexistence: the suffix is why this installs beside an official DSH Go instead of over it.
          case "$badge" in
            *"name='io.github.ccch1mneyyy.dsh_app.a11y'"*) ;;
            *) echo "::error::unexpected package: $badge"; exit 1 ;;
          esac
          # ...and the components must still resolve into the namespace, not into <applicationId>:
          # the manifest names them relative (".MainActivity") and the launcher entries are
          # activity-aliases, so none of this comes from `badging`. Positive check only — some
          # library's meta-data legitimately carries ${applicationId} somewhere.
          manifest=$("$aapt2" dump xmltree "$apk" --file AndroidManifest.xml)
          names=$(echo "$manifest" | grep -oE 'name\(0x01010003\)="[^"]*"' | sort -u)
          echo "$names"
          for want in MainActivity LauncherMist LauncherMistAlt LauncherNight LauncherFrost LauncherInk; do
            case "$names" in
              *"\"io.github.ccch1mneyyy.dsh_app.$want\""*) ;;
              *) echo "::error::$want did not resolve into the namespace"; exit 1 ;;
            esac
          done
          echo "apk=$apk ($(du -h "$apk" | cut -f1))"
          echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-${{ matrix.flavor }}-${{ matrix.mode }}
          path: app/build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-${{ matrix.mode }}.apk
          if-no-files-found: error
